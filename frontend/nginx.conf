server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ── Proxy para API de Lançamentos ──────────────────────────────────────────
    location /api/lancamentos {
        proxy_pass         http://lancamentos-api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # ── Proxy para API de Consolidado ──────────────────────────────────────────
    location /api/consolidado {
        proxy_pass         http://consolidado-api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location /api/health {
        proxy_pass http://lancamentos-api:8080;
        proxy_http_version 1.1;
    }

    # ── Angular SPA — fallback para index.html (client-side routing) ───────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Cache para assets buildados ────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Segurança: esconder versão nginx ───────────────────────────────────────
    server_tokens off;
}
