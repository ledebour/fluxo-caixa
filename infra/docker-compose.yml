version: '3.9'

services:

  # ─── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: fluxo-caixa-postgres
    environment:
      POSTGRES_USER: fluxo
      POSTGRES_PASSWORD: fluxo123
      POSTGRES_DB: fluxo_caixa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluxo -d fluxo_caixa"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fluxo-net

  # ─── Redis ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: fluxo-caixa-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fluxo-net

  # ─── RabbitMQ ────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: fluxo-caixa-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: fluxo
      RABBITMQ_DEFAULT_PASS: fluxo123
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - fluxo-net

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  fluxo-net:
    driver: bridge
