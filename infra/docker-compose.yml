version: '3.9'

services:

  # ─── Infraestrutura ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: fluxo-postgres
    environment:
      POSTGRES_USER: fluxo
      POSTGRES_PASSWORD: fluxo123
      POSTGRES_DB: fluxo_caixa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluxo -d fluxo_caixa"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fluxo-net

  redis:
    image: redis:7-alpine
    container_name: fluxo-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fluxo-net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: fluxo-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: fluxo
      RABBITMQ_DEFAULT_PASS: fluxo123
    ports:
      - "5672:5672"
      - "15672:15672"   # Management UI: http://localhost:15672
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - fluxo-net

  # ─── Microserviços ───────────────────────────────────────────────────────────

  lancamentos-api:
    build:
      context: ../src
      dockerfile: FluxoCaixa.Lancamentos.API/Dockerfile
    container_name: fluxo-lancamentos-api
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__PostgreSQL: "Host=postgres;Port=5432;Database=fluxo_caixa;Username=fluxo;Password=fluxo123"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__Username: fluxo
      RabbitMQ__Password: fluxo123
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - fluxo-net

  consolidado-api:
    build:
      context: ../src
      dockerfile: FluxoCaixa.Consolidado.API/Dockerfile
    container_name: fluxo-consolidado-api
    ports:
      - "5002:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__PostgreSQL: "Host=postgres;Port=5432;Database=fluxo_caixa;Username=fluxo;Password=fluxo123"
      ConnectionStrings__Redis: "redis:6379"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__Username: fluxo
      RabbitMQ__Password: fluxo123
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - fluxo-net

  # ─── Frontend ─────────────────────────────────────────────────────────────────

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: fluxo-frontend
    ports:
      - "4200:80"
    depends_on:
      - lancamentos-api
      - consolidado-api
    networks:
      - fluxo-net

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  fluxo-net:
    driver: bridge
